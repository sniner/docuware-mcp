[project]
name = "docuware-mcp"
version = "0.1.3"
description = "MCP server exposing a DocuWare DMS to LLM-based agents"
authors = [{ name = "Stefan Schönberger", email = "stefan@sniner.dev" }]
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "docuware-client>=0.8.1",
    "fastmcp>=2.0.0",
]

[project.scripts]
docuware-mcp = "docuware_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
    "basedpyright>=1.38.2,<2",
    "ruff>=0.15.5,<0.16",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv-build>=0.10.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "docuware_mcp"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 96

[tool.ruff.lint]
ignore = ["E402"]
per-file-ignores = { "__init__.py" = ["F401"] }
